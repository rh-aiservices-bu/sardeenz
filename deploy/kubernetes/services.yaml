---
# Headless Service for pod discovery and direct pod addressing
apiVersion: v1
kind: Service
metadata:
  name: sardeenz-headless
  labels:
    app: sardeenz
spec:
  clusterIP: None
  selector:
    app: sardeenz
  ports:
    - port: 3000
      name: http
    - port: 5001
      name: vllm
---
# Regular Service for external access (load-balanced across pods)
apiVersion: v1
kind: Service
metadata:
  name: sardeenz
  labels:
    app: sardeenz
spec:
  type: ClusterIP
  selector:
    app: sardeenz
  ports:
    - port: 3000
      name: http
      targetPort: http
