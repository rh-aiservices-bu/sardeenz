---
# Cluster secret for HMAC-SHA256 inter-pod authentication.
# IMPORTANT: Replace the value below with a securely generated secret.
# Generate with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: sardeenz-cluster-secret
  labels:
    app: sardeenz
type: Opaque
stringData:
  CLUSTER_SECRET: "CHANGE-ME-generate-with-openssl-rand-hex-32"
