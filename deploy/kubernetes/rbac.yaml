---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sardeenz
  labels:
    app: sardeenz
---
# Role for pod discovery (get/list/watch pods) and leader election (leases)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sardeenz-cluster
  labels:
    app: sardeenz
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sardeenz-cluster
  labels:
    app: sardeenz
subjects:
  - kind: ServiceAccount
    name: sardeenz
roleRef:
  kind: Role
  name: sardeenz-cluster
  apiGroup: rbac.authorization.k8s.io
