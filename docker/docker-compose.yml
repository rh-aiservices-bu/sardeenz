services:
  postgresql:
    image: postgres:16-alpine
    container_name: sardeenz-postgresql
    environment:
      - POSTGRES_USER=sardeenz
      - POSTGRES_PASSWORD=sardeenz
      - POSTGRES_DB=sardeenz
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sardeenz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sardeenz:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Containerfile
    container_name: sardeenz
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - ENABLE_KVCACHED=true
      - KVCACHED_AUTOPATCH=1
      - VLLM_BASE_PORT=12346
      - VLLM_MAX_INSTANCES=10
      - DATABASE_URL=postgresql://sardeenz:sardeenz@postgresql:5432/sardeenz
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
