apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sardeenz
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz
    app.kubernetes.io/component: ml-platform
    app.kubernetes.io/part-of: sardeenz
  annotations:
    haproxy.router.openshift.io/timeout: 300s  # 5 minute timeout for long-running inference
    haproxy.router.openshift.io/timeout-tunnel: 300s  # Required for SSE streaming
spec:
  to:
    kind: Service
    name: sardeenz
    weight: 100
  port:
    targetPort: backend
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
