apiVersion: v1
kind: Secret
metadata:
  name: sardeenz-secrets
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz
    app.kubernetes.io/component: ml-platform
    app.kubernetes.io/part-of: sardeenz
type: Opaque
stringData:
  # =============================================================================
  # JWT Configuration (REQUIRED for AUTH_MODE=simple or AUTH_MODE=oauth)
  # =============================================================================

  # JWT secret for token signing - generate with: openssl rand -base64 32
  jwt-secret: "REPLACE_WITH_SECURE_RANDOM_STRING"

  # =============================================================================
  # Simple Auth Mode (required when AUTH_MODE=simple)
  # =============================================================================

  # Admin password for simple authentication
  admin-password: "REPLACE_WITH_ADMIN_PASSWORD"

  # =============================================================================
  # OAuth 2.0 Configuration (required when AUTH_MODE=oauth)
  # =============================================================================

  # OAuth Client ID (from your OAuth provider)
  client-id: "REPLACE_WITH_YOUR_CLIENT_ID"

  # OAuth Client Secret (from your OAuth provider)
  client-secret: "REPLACE_WITH_YOUR_CLIENT_SECRET"

  # OAuth Issuer URL (e.g., https://oauth-openshift.apps.cluster.example.com for OpenShift)
  issuer-url: "REPLACE_WITH_YOUR_ISSUER_URL"

  # Kubernetes API URL for OpenShift OAuth user info endpoint
  # (e.g., https://api.cluster.example.com:6443)
  k8s-api-url: ""

  # =============================================================================
  # Inference API Key (optional - for OpenAI-compatible endpoint auth)
  # =============================================================================

  # When set, /v1/* and /api/direct/* endpoints require Bearer token auth
  # Leave empty to allow unauthenticated access to inference endpoints
  inference-api-key: ""

  # =============================================================================
  # HuggingFace Token (optional - for gated models)
  # =============================================================================

  # Get your token from: https://huggingface.co/settings/tokens
  # Required for gated models like Llama, Mistral, etc.
  hf-token: ""

---
# =============================================================================
# Secret Creation Examples (use instead of applying this file directly)
# =============================================================================
#
# For no authentication (AUTH_MODE=none):
# ----------------------------------------
# oc create secret generic sardeenz-secrets \
#   --from-literal=hf-token=$HF_TOKEN \
#   -n sardeenz
#
# For simple authentication (AUTH_MODE=simple):
# ---------------------------------------------
# oc create secret generic sardeenz-secrets \
#   --from-literal=jwt-secret=$(openssl rand -base64 32) \
#   --from-literal=admin-password=YOUR_SECURE_PASSWORD \
#   --from-literal=hf-token=$HF_TOKEN \
#   -n sardeenz
#
# For OAuth 2.0 (AUTH_MODE=oauth):
# --------------------------------
# oc create secret generic sardeenz-secrets \
#   --from-literal=client-id=$OAUTH_CLIENT_ID \
#   --from-literal=client-secret=$OAUTH_CLIENT_SECRET \
#   --from-literal=issuer-url=$OAUTH_ISSUER_URL \
#   --from-literal=jwt-secret=$(openssl rand -base64 32) \
#   --from-literal=k8s-api-url=https://api.cluster.example.com:6443 \
#   --from-literal=hf-token=$HF_TOKEN \
#   -n sardeenz
#
# To add inference API key (works with any auth mode):
# ----------------------------------------------------
# Add: --from-literal=inference-api-key=YOUR_API_KEY
