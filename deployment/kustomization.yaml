apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: sardeenz

# Namespace for all resources (customize per environment)
namespace: sardeenz

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "1.0.0"

# Resources to deploy
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - pvc.yaml
  - pvc-app-data.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

# Image configuration (customize with your registry)
images:
  - name: quay.io/sardeenz/sardeenz
    newName: quay.io/your-org/sardeenz
    newTag: latest

# ConfigMap generator (alternative to configmap.yaml)
# Uncomment to generate ConfigMap from env file
# configMapGenerator:
#   - name: sardeenz-config
#     envs:
#       - config.env

# Secret generator (alternative to secret.yaml)
# Uncomment to generate Secret from env file (DO NOT commit this file)
# secretGenerator:
#   - name: sardeenz-secrets
#     envs:
#       - secrets.env
