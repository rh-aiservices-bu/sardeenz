apiVersion: apps/v1
kind: Deployment
metadata:
  name: sardeenz-postgresql
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: sardeenz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sardeenz-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sardeenz-postgresql
        app.kubernetes.io/name: sardeenz-postgresql
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: db-username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: db-password
            - name: POSTGRESQL_DATABASE
              value: sardeenz
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgsql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sardeenz"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sardeenz"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: sardeenz-postgresql-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sardeenz-postgresql-data
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: sardeenz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sardeenz-postgresql
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: sardeenz
spec:
  type: ClusterIP
  selector:
    app: sardeenz-postgresql
  ports:
    - port: 5432
      targetPort: postgresql
      name: postgresql
