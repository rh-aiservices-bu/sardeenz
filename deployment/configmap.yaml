apiVersion: v1
kind: ConfigMap
metadata:
  name: sardeenz-config
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz
    app.kubernetes.io/component: ml-platform
    app.kubernetes.io/part-of: sardeenz
data:
  # =============================================================================
  # Server Configuration
  # =============================================================================
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"

  # =============================================================================
  # Authentication Configuration
  # =============================================================================

  # Authentication mode: 'none', 'simple', or 'oauth'
  # - none: No authentication (default, suitable for development/trusted environments)
  # - simple: Username/password authentication (set ADMIN_PASSWORD in secret)
  # - oauth: OAuth 2.0 integration (configure OAuth credentials in secret)
  AUTH_MODE: "none"

  # Admin username for simple auth mode
  ADMIN_USERNAME: "admin"

  # JWT token expiration in hours
  JWT_EXPIRATION_HOURS: "8"

  # API base URL for OAuth callbacks - set to your route URL
  # Example: https://sardeenz-myproject.apps.cluster.example.com
  API_BASE_URL: ""

  # =============================================================================
  # kvcached Configuration
  # =============================================================================
  ENABLE_KVCACHED: "true"
  KVCACHED_AUTOPATCH: "1"

  # =============================================================================
  # vLLM Instance Configuration
  # =============================================================================
  VLLM_BASE_PORT: "12346"
  VLLM_MAX_INSTANCES: "10"

  # Model startup timeout in ms (default 30 min)
  # Increase for slow network connections or very large models
  VLLM_STARTUP_TIMEOUT: "1800000"

  # =============================================================================
  # Optional Features
  # =============================================================================

  # Path to local pre-downloaded models (leave empty to disable)
  # Example: /models or /mnt/pvc/models
  LOCAL_MODELS_PATH: ""

  # Enable verbose streaming debug logs (SSE request/response/chunks)
  # Set to 'true' to debug SSE streaming issues
  DEBUG_STREAMING: "false"
