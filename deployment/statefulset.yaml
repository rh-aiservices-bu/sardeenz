apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sardeenz
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz
    app.kubernetes.io/component: ml-platform
    app.kubernetes.io/part-of: sardeenz
spec:
  # Default: single pod. Scale to N for multi-pod cluster.
  # When scaling, also update CLUSTER_EXPECTED_PODS in configmap.yaml.
  replicas: 1
  serviceName: sardeenz-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: sardeenz
  template:
    metadata:
      labels:
        app: sardeenz
        app.kubernetes.io/name: sardeenz
        app.kubernetes.io/component: ml-platform
    spec:
      serviceAccountName: sardeenz
      terminationGracePeriodSeconds: 30

      # GPU node selector - target nodes with NVIDIA GPUs
      nodeSelector:
        nvidia.com/gpu.present: "true"

      # Toleration for GPU nodes (if they are tainted)
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      # Spread pods across nodes for GPU distribution (multi-pod)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - sardeenz
                topologyKey: kubernetes.io/hostname

      containers:
        - name: sardeenz
          image: quay.io/rh-aiservices-bu/sardeenz:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            # =================================================================
            # Server Configuration (from ConfigMap)
            # =================================================================
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: PORT
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: HOST
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: LOG_LEVEL

            # =================================================================
            # Authentication Configuration
            # =================================================================
            - name: AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: AUTH_MODE
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: admin-password
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: jwt-secret
                  optional: true
            - name: JWT_EXPIRATION_HOURS
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: JWT_EXPIRATION_HOURS
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: API_BASE_URL
                  optional: true

            # OAuth credentials (from Secret)
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: client-id
                  optional: true
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: client-secret
                  optional: true
            - name: OAUTH_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: issuer-url
                  optional: true
            - name: K8S_API_URL
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: k8s-api-url
                  optional: true
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # Inference API key (optional)
            - name: INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: inference-api-key
                  optional: true

            # =================================================================
            # Cluster Configuration
            # =================================================================
            - name: CLUSTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: cluster-secret
                  optional: true
            - name: CLUSTER_EXPECTED_PODS
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: CLUSTER_EXPECTED_PODS

            # =================================================================
            # Database Configuration
            # =================================================================
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: database-url

            # =================================================================
            # kvcached Configuration (from ConfigMap)
            # =================================================================
            - name: ENABLE_KVCACHED
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: ENABLE_KVCACHED
            - name: KVCACHED_AUTOPATCH
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: KVCACHED_AUTOPATCH

            # =================================================================
            # vLLM Configuration (from ConfigMap)
            # =================================================================
            - name: VLLM_BASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: VLLM_BASE_PORT
            - name: VLLM_MAX_INSTANCES
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: VLLM_MAX_INSTANCES
            - name: VLLM_STARTUP_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: VLLM_STARTUP_TIMEOUT

            # =================================================================
            # Optional Features (from ConfigMap)
            # =================================================================
            - name: LOCAL_MODELS_PATH
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: LOCAL_MODELS_PATH
                  optional: true
            - name: DEBUG_STREAMING
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: DEBUG_STREAMING
                  optional: true

            # =================================================================
            # HuggingFace Configuration (from Secret)
            # =================================================================
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: hf-token
                  optional: true

            # =================================================================
            # Container Paths
            # =================================================================
            - name: HF_HOME
              value: "/opt/app-root/models"
            - name: HOME
              value: "/opt/app-root/src"
            - name: XDG_CACHE_HOME
              value: "/opt/app-root/src/.cache"
            - name: FLASHINFER_WORKSPACE_DIR
              value: "/opt/app-root/src/.cache/flashinfer"

          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: 1

          # Startup probe - 30 min grace period for large model downloads
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            failureThreshold: 120
            periodSeconds: 15

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: huggingface-cache
              mountPath: /opt/app-root/models

          securityContext:
            allowPrivilegeEscalation: false

      volumes:
        - name: huggingface-cache
          persistentVolumeClaim:
            claimName: sardeenz-model-cache

      securityContext:
        runAsNonRoot: true
