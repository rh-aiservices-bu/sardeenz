apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sardeenz-model-cache
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz
    app.kubernetes.io/component: ml-platform
    app.kubernetes.io/part-of: sardeenz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi  # Adjust based on model sizes - typical models: 7B=~14GB, 13B=~26GB, 70B=~140GB
  # Optional: Specify storage class for performance optimization
  # storageClassName: fast-ssd
  # volumeMode: Filesystem
