apiVersion: apps/v1
kind: Deployment
metadata:
  name: sardeenz
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz
    app.kubernetes.io/component: ml-platform
    app.kubernetes.io/part-of: sardeenz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sardeenz
  strategy:
    type: Recreate  # Required for GPU workloads - cannot run multiple replicas on same GPU
  template:
    metadata:
      labels:
        app: sardeenz
        app.kubernetes.io/name: sardeenz
        app.kubernetes.io/component: ml-platform
    spec:
      # ServiceAccount for RBAC checks (LocalSubjectAccessReview)
      serviceAccountName: sardeenz

      # GPU node selector - target nodes with NVIDIA GPUs
      nodeSelector:
        nvidia.com/gpu.present: "true"

      # Toleration for GPU nodes (if they are tainted)
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: sardeenz
          image: quay.io/rh-aiservices-bu/sardeenz:latest
          imagePullPolicy: Always

          ports:
            - name: backend
              containerPort: 3000
              protocol: TCP
            - name: frontend
              containerPort: 80
              protocol: TCP

          env:
            # =================================================================
            # Server Configuration (from ConfigMap)
            # =================================================================
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: PORT
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: HOST
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: LOG_LEVEL

            # =================================================================
            # Authentication Configuration
            # =================================================================
            - name: AUTH_MODE
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: AUTH_MODE
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: admin-password
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: jwt-secret
                  optional: true
            - name: JWT_EXPIRATION_HOURS
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: JWT_EXPIRATION_HOURS
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: API_BASE_URL
                  optional: true

            # OAuth credentials (from Secret)
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: client-id
                  optional: true
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: client-secret
                  optional: true
            - name: OAUTH_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: issuer-url
                  optional: true
            - name: K8S_API_URL
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: k8s-api-url
                  optional: true
            # Namespace for RBAC checks (uses downward API)
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # Inference API key (optional)
            - name: INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: inference-api-key
                  optional: true

            # =================================================================
            # kvcached Configuration (from ConfigMap)
            # =================================================================
            - name: ENABLE_KVCACHED
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: ENABLE_KVCACHED
            - name: KVCACHED_AUTOPATCH
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: KVCACHED_AUTOPATCH

            # =================================================================
            # vLLM Configuration (from ConfigMap)
            # =================================================================
            - name: VLLM_BASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: VLLM_BASE_PORT
            - name: VLLM_MAX_INSTANCES
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: VLLM_MAX_INSTANCES
            - name: VLLM_STARTUP_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: VLLM_STARTUP_TIMEOUT

            # =================================================================
            # Optional Features (from ConfigMap)
            # =================================================================
            - name: LOCAL_MODELS_PATH
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: LOCAL_MODELS_PATH
                  optional: true
            - name: DEBUG_STREAMING
              valueFrom:
                configMapKeyRef:
                  name: sardeenz-config
                  key: DEBUG_STREAMING
                  optional: true

            # =================================================================
            # HuggingFace Configuration (from Secret)
            # =================================================================
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sardeenz-secrets
                  key: hf-token
                  optional: true

            # =================================================================
            # Container Paths
            # =================================================================
            # HuggingFace cache location (for model downloads)
            - name: HF_HOME
              value: "/opt/app-root/models"
            # SQLite database path (persistent storage)
            - name: SARDEENZ_DB_PATH
              value: "/opt/app-root/src/data/sardeenz.db"
            # OpenShift arbitrary UID support - cache directories
            - name: HOME
              value: "/opt/app-root/src"
            - name: XDG_CACHE_HOME
              value: "/opt/app-root/src/.cache"
            - name: FLASHINFER_WORKSPACE_DIR
              value: "/opt/app-root/src/.cache/flashinfer"

          # Resource requests and limits
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: 1

          # Liveness probe - checks if container is healthy
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: backend
              scheme: HTTP
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          # Readiness probe - checks if container is ready to serve traffic
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: backend
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          # Startup probe - gives container time to start before liveness/readiness kicks in
          startupProbe:
            httpGet:
              path: /api/health
              port: backend
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 12  # 2 minutes (12 * 10s) to start

          volumeMounts:
            - name: huggingface-cache
              mountPath: /opt/app-root/models
            - name: app-data
              mountPath: /opt/app-root/src

      volumes:
        - name: huggingface-cache
          persistentVolumeClaim:
            claimName: sardeenz-model-cache
        - name: app-data
          persistentVolumeClaim:
            claimName: sardeenz-app-data

      # Security context - OpenShift runs as non-root with random UID
      securityContext:
        runAsNonRoot: true
