apiVersion: v1
kind: Secret
metadata:
  name: sardeenz-oauth
  labels:
    app: sardeenz
    app.kubernetes.io/name: sardeenz
    app.kubernetes.io/component: ml-platform
    app.kubernetes.io/part-of: sardeenz
type: Opaque
stringData:
  # OAuth 2.0 configuration
  # Replace these placeholder values with your actual OAuth provider credentials

  # OAuth Client ID (from your OAuth provider)
  client-id: "REPLACE_WITH_YOUR_CLIENT_ID"

  # OAuth Client Secret (from your OAuth provider)
  client-secret: "REPLACE_WITH_YOUR_CLIENT_SECRET"

  # OAuth Issuer URL (e.g., https://auth.example.com/realms/my-realm for Keycloak)
  issuer-url: "REPLACE_WITH_YOUR_ISSUER_URL"

---
# NOTE: To create this secret from command line instead of using this file:
#
# oc create secret generic sardeenz-oauth \
#   --from-literal=client-id=YOUR_CLIENT_ID \
#   --from-literal=client-secret=YOUR_CLIENT_SECRET \
#   --from-literal=issuer-url=YOUR_ISSUER_URL \
#   -n your-namespace
#
# Or to use environment variables:
#
# oc create secret generic sardeenz-oauth \
#   --from-literal=client-id=$OAUTH_CLIENT_ID \
#   --from-literal=client-secret=$OAUTH_CLIENT_SECRET \
#   --from-literal=issuer-url=$OAUTH_ISSUER_URL \
#   -n your-namespace
